<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Học phần của tôi - Course Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', system-ui, sans-serif; }
        .course-img { height: 160px; object-fit: cover; }
        .card { border-radius: 12px; overflow: hidden; transition: transform .2s; }
        .card:hover { transform: translateY(-4px); }
        @media (max-width: 768px) { .course-img { height: 140px; } }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" th:href="@{/home}">Course Registration</a>
            <a class="nav-link text-white" th:href="@{/home}">Trang chủ</a>
            <a class="nav-link text-white" th:href="@{/my-courses}">Học phần của tôi</a>
        </div>
    </nav>

    <main class="container py-4">
        <h2 class="mb-4"><i class="bi bi-collection"></i> Học phần của tôi</h2>

        <div th:if="${#lists.isEmpty(enrollments)}" class="alert alert-info">
            Bạn chưa đăng ký học phần nào. <a th:href="@{/home}">Xem danh sách học phần</a>
        </div>

        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" th:if="${!#lists.isEmpty(enrollments)}">
            <div class="col" th:each="enr : ${enrollments}">
                <div class="card h-100 shadow-sm">
                    <img th:src="${enr.course.image} ?: 'https://picsum.photos/300/200'" class="card-img-top course-img" alt="Course">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${enr.course.name}">Tên</h5>
                        <p class="card-text mb-1"><i class="bi bi-award"></i> <span th:text="|${enr.course.credits} tín chỉ|"></span></p>
                        <p class="card-text mb-1"><i class="bi bi-person"></i> <span th:text="${enr.course.lecturer}"></span></p>
                        <p class="card-text text-muted small"><i class="bi bi-calendar"></i> Đăng ký: <span th:text="${#temporals.format(enr.enrollDate, 'dd/MM/yyyy')}"></span></p>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
