<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý học phần - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', system-ui, sans-serif; }
        .table { border-radius: 8px; overflow: hidden; }
        .course-thumb { width: 60px; height: 45px; object-fit: cover; border-radius: 6px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" th:href="@{/home}">Course Registration</a>
            <a class="nav-link text-white" th:href="@{/home}">Trang chủ</a>
        </div>
    </nav>

    <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1100">
        <div id="toastMsg" class="toast align-items-center text-bg-success border-0" role="alert" th:if="${message}">
            <div class="d-flex">
                <div class="toast-body" th:text="${message}"></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
        <div id="toastErr" class="toast align-items-center text-bg-danger border-0" role="alert" th:if="${error}">
            <div class="d-flex">
                <div class="toast-body" th:text="${error}"></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

    <main class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Quản lý học phần</h2>
            <a th:href="@{/admin/courses/new}" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Thêm học phần</a>
        </div>

        <div class="table-responsive">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Hình ảnh</th>
                        <th>Tên</th>
                        <th>Tín chỉ</th>
                        <th>Giảng viên</th>
                        <th>Danh mục</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(courses)}"><td colspan="7" class="text-center text-muted">Chưa có học phần nào.</td></tr>
                    <tr th:each="c : ${courses}">
                        <td th:text="${c.id}"></td>
                        <td>
                            <img th:src="${c.image} ?: 'https://picsum.photos/60/45'" class="course-thumb" alt="Course" onerror="this.src='https://picsum.photos/60/45'">
                        </td>
                        <td th:text="${c.name}"></td>
                        <td th:text="${c.credits}"></td>
                        <td th:text="${c.lecturer}"></td>
                        <td th:text="${c.category.name}"></td>
                        <td>
                            <a th:href="@{/admin/courses/edit/{id}(id=${c.id})}" class="btn btn-sm btn-outline-primary">Sửa</a>
                            <form th:action="@{/admin/courses/delete/{id}(id=${c.id})}" method="post" class="d-inline" onsubmit="return confirm('Xóa học phần này?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Xóa</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        (function() {
            const toastMsg = document.getElementById('toastMsg');
            const toastErr = document.getElementById('toastErr');
            if (toastMsg) {
                new bootstrap.Toast(toastMsg, { autohide: true, delay: 4000 }).show();
            }
            if (toastErr) {
                new bootstrap.Toast(toastErr, { autohide: true, delay: 5000 }).show();
            }
        })();
    </script>
</body>
</html>
