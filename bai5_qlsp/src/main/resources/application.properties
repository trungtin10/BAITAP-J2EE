spring.application.name=bai5_qlsp

# Anh upload: duong dan tuong doi theo thu muc lam viec (thuong la thu muc goc module khi chay IDE)
app.upload.images-dir=uploads/images
# Khi true: luc khoi dong copy anh tu static/images len thu muc upload neu thieu nhung DB van luu ten file do
app.image.sync.enabled=true

# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/bai5_qlsp?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Tat khoi tao data.sql mac dinh
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false
