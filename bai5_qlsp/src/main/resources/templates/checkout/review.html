<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Xác nhận đặt hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/products}">QUẢN LÝ SẢN PHẨM</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/products}">Sản phẩm</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/cart}">Giỏ hàng</a></li>
                <li class="nav-item"><a class="nav-link active" th:href="@{/checkout}">Đặt hàng</a></li>
            </ul>
            <form th:action="@{/logout}" method="post" th:if="${#authorization.expression('isAuthenticated()')}">
                <button type="submit" class="btn btn-danger btn-sm px-3">Đăng xuất</button>
            </form>
        </div>
    </div>
</nav>

<div class="container">
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-header bg-white py-3">
            <h4 class="mb-1 text-primary">Xác nhận đơn hàng</h4>
            <p class="text-muted small mb-0">Kiểm tra lại thông tin trước khi gửi đơn. Đơn sẽ được lưu vào hệ thống kèm chi tiết từng dòng.</p>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                    <tr>
                        <th class="ps-4">Tên sản phẩm</th>
                        <th>Đơn giá</th>
                        <th>Số lượng</th>
                        <th>Tổng tiền</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="line : ${cartLines}">
                        <td class="ps-4 fw-bold" th:text="${line.productName}"></td>
                        <td class="text-danger fw-bold"
                            th:text="${line.price != null ? #numbers.formatInteger(line.price, 0, 'POINT') + ' VNĐ' : '0 VNĐ'}"></td>
                        <td th:text="${line.quantity}"></td>
                        <td class="fw-bold"
                            th:text="${line.subtotal != null ? #numbers.formatInteger(line.subtotal, 0, 'POINT') + ' VNĐ' : '0 VNĐ'}"></td>
                    </tr>
                    </tbody>
                    <tfoot class="table-light">
                    <tr>
                        <td colspan="3" class="text-end fw-bold pe-4">Tổng thanh toán</td>
                        <td class="fw-bold text-success fs-5"
                            th:text="${#numbers.formatInteger(grandTotal, 0, 'POINT')} + ' VNĐ'"></td>
                    </tr>
                    </tfoot>
                </table>
            </div>
            <div class="p-3 border-top bg-white d-flex flex-wrap gap-2 justify-content-between">
                <a th:href="@{/cart}" class="btn btn-outline-secondary">
                    <i class="fas fa-arrow-left me-1"></i>Quay lại giỏ hàng
                </a>
                <form th:action="@{/checkout/confirm}" method="post">
                    <button type="submit" class="btn btn-success btn-lg">
                        <i class="fas fa-check-circle me-1"></i>Xác nhận đặt hàng
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<footer class="text-center mt-5 py-4 text-muted small">
    <p>&copy; 2025 - Hệ thống Quản lý Sản phẩm</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
