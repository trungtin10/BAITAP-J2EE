<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thêm Sản phẩm mới</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/products}">Quản lý sản phẩm</a>
    </div>
</nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-lg border-0 rounded-3">
                <div class="card-header bg-success text-white text-center py-3">
                    <h2 class="mb-0"><i class="fas fa-plus-circle me-2"></i>Thêm Sản phẩm mới</h2>
                </div>
                <div class="card-body p-5">
                    <form th:action="@{/products/create}" th:object="${product}" method="post" enctype="multipart/form-data">

                        <!-- Tên sản phẩm -->
                        <div class="mb-4">
                            <label for="name" class="form-label fw-bold text-secondary">Tên sản phẩm</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="fas fa-tag"></i></span>
                                <input type="text" id="name" th:field="*{name}" class="form-control" placeholder="Nhập tên sản phẩm...">
                            </div>
                            <div class="text-danger mt-1 small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                        </div>

                        <!-- Giá sản phẩm -->
                        <div class="mb-4">
                            <label for="price" class="form-label fw-bold text-secondary">Giá bán</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="fas fa-money-bill-wave"></i></span>
                                <input type="number" id="price" th:field="*{price}" class="form-control" placeholder="Nhập giá...">
                                <span class="input-group-text">VNĐ</span>
                            </div>
                            <div class="text-danger mt-1 small" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
                        </div>

                        <!-- Danh mục -->
                        <div class="mb-4">
                            <label for="category" class="form-label fw-bold text-secondary">Danh mục</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="fas fa-list"></i></span>
                                <select id="category" th:field="*{category}" class="form-select">
                                    <option value="">-- Chọn danh mục --</option>
                                    <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                                </select>
                            </div>
                            <div class="text-danger mt-1 small" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></div>
                        </div>

                        <!-- Hình ảnh -->
                        <div class="mb-4">
                            <label for="imageFile" class="form-label fw-bold text-secondary">Hình ảnh sản phẩm</label>
                            <input type="file" id="imageFile" name="imageFile" class="form-control" onchange="previewImage(this)">
                            <div class="mt-3 text-center">
                                <img id="imagePreview" src="https://via.placeholder.com/150" alt="Preview"
                                     class="img-thumbnail shadow-sm" style="max-width: 200px; display: none;">
                            </div>
                        </div>

                        <!-- Nút bấm -->
                        <div class="d-grid gap-2 d-md-flex justify-content-md-end border-top pt-4">
                            <a th:href="@{/products}" class="btn btn-outline-secondary px-4 me-md-2">
                                <i class="fas fa-arrow-left me-1"></i> Quay lại
                            </a>
                            <button type="submit" class="btn btn-success px-5 shadow-sm">
                                <i class="fas fa-save me-1"></i> Lưu sản phẩm
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<footer class="text-center mt-5 py-4 text-muted">
    <p class="mb-0">&copy; 2025 - Phát triển ứng dụng với J2EE</p>
</footer>

<script>
    function previewImage(input) {
        const preview = document.getElementById('imagePreview');
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                preview.src = e.target.result;
                preview.style.display = 'inline-block';
            }
            reader.readAsDataURL(input.files[0]);
        }
    }
</script>

</body>
</html>
