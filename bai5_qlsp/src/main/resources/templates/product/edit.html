<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Chỉnh sửa Sản phẩm</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div layout:fragment="content" class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-lg border-0">
                    <div class="card-header bg-warning text-dark text-center">
                        <h2 class="mb-0"><i class="fa-solid fa-pen-to-square me-2"></i>Chỉnh sửa Sản phẩm</h2>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/products/edit/{id}(id=${product.id})}" th:object="${product}" method="post" enctype="multipart/form-data">
                            <!-- Product Name -->
                            <div class="mb-3">
                                <label for="name" class="form-label fw-bold">Tên sản phẩm</label>
                                <input type="text" id="name" th:field="*{name}" class="form-control" placeholder="Nhập tên sản phẩm...">
                                <div class="text-danger mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                            </div>

                            <!-- Product Price -->
                            <div class="mb-3">
                                <label for="price" class="form-label fw-bold">Giá</label>
                                <div class="input-group">
                                    <input type="number" id="price" th:field="*{price}" class="form-control" placeholder="Nhập giá...">
                                    <span class="input-group-text">VNĐ</span>
                                </div>
                                <div class="text-danger mt-1" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
                            </div>

                            <!-- Category -->
                            <div class="mb-3">
                                <label for="category" class="form-label fw-bold">Danh mục</label>
                                <select id="category" th:field="*{category}" class="form-select">
                                    <option value="">-- Chọn danh mục --</option>
                                    <option th:each="cat : ${categories}"
                                            th:value="${cat.id}"
                                            th:text="${cat.name}">
                                    </option>
                                </select>
                                <div class="text-danger mt-1" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></div>
                            </div>

                            <!-- Image Upload with Preview -->
                            <div class="mb-4">
                                <label for="imageFile" class="form-label fw-bold">Hình ảnh</label>
                                <input type="file" id="imageFile" name="imageFile" class="form-control" onchange="previewImage(this)">

                                <div class="mt-3 text-center">
                                    <p class="text-muted small mb-1">Xem trước hình ảnh:</p>
                                    <img id="imagePreview" alt="Preview" class="img-thumbnail shadow-sm"
                                         style="max-width: 200px; min-height: 100px; object-fit: cover;"
                                         th:if="${product.image != null}"
                                         th:src="@{/images/{img}(img=${product.image})}">
                                    <img id="imagePreview" alt="Preview" class="img-thumbnail shadow-sm"
                                         style="max-width: 200px; min-height: 100px; object-fit: cover;"
                                         th:unless="${product.image != null}"
                                         src="https://via.placeholder.com/150">
                                </div>
                            </div>

                            <!-- Actions -->
                            <div class="d-grid gap-2 d-md-flex justify-content-md-end border-top pt-3">
                                <a th:href="@{/products}" class="btn btn-secondary me-md-2">
                                    <i class="fa-solid fa-arrow-left me-1"></i> Quay lại
                                </a>
                                <button type="submit" class="btn btn-warning px-4">
                                    <i class="fa-solid fa-save me-1"></i> Cập nhật
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript for Image Preview -->
    <script th:inline="javascript">
        function previewImage(input) {
            const preview = document.getElementById('imagePreview');
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                }
                reader.readAsDataURL(input.files[0]);
            }
        }
    </script>
</body>
</html>
