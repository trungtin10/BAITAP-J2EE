<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Giỏ hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/products}">QUẢN LÝ SẢN PHẨM</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/products}">Sản phẩm</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/cart}">Giỏ hàng</a>
                </li>
            </ul>
            <form th:action="@{/logout}" method="post" th:if="${#authorization.expression('isAuthenticated()')}">
                <button type="submit" class="btn btn-danger btn-sm px-3">
                    <i class="fas fa-sign-out-alt me-1"></i>Đăng xuất
                </button>
            </form>
        </div>
    </div>
</nav>

<div class="container">
    <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${message}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-header bg-white py-3 d-flex flex-wrap justify-content-between align-items-center gap-2">
            <div>
                <h4 class="mb-0 text-primary">Giỏ hàng của bạn</h4>
                <p class="text-muted small mb-0">Danh sách sản phẩm đã chọn — chỉnh số lượng hoặc xóa dòng tại đây.</p>
            </div>
            <a th:href="@{/products}" class="btn btn-outline-primary btn-sm">
                <i class="fas fa-arrow-left me-1"></i>Tiếp tục mua
            </a>
        </div>
        <div class="card-body p-0" th:if="${!emptyCart}">
            <div class="table-responsive">
                <table class="table table-hover mb-0 align-middle">
                    <thead class="table-light">
                    <tr>
                        <th class="ps-4">Tên sản phẩm</th>
                        <th>Đơn giá</th>
                        <th style="min-width: 140px;">Số lượng</th>
                        <th>Tổng tiền</th>
                        <th class="text-center" style="width: 5rem;"></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="line : ${cartLines}">
                        <td class="ps-4 fw-bold" th:text="${line.productName}"></td>
                        <td class="text-danger fw-bold"
                            th:text="${line.price != null ? #numbers.formatInteger(line.price, 0, 'POINT') + ' VNĐ' : '0 VNĐ'}"></td>
                        <td>
                            <form th:action="@{/cart/update}" method="post" class="d-flex gap-1 align-items-center">
                                <input type="hidden" name="productId" th:value="${line.productId}">
                                <input type="number" name="quantity" th:value="${line.quantity}" min="1" class="form-control form-control-sm" style="width: 4.5rem;">
                                <button type="submit" class="btn btn-outline-secondary btn-sm" title="Cập nhật">
                                    <i class="fas fa-sync-alt"></i>
                                </button>
                            </form>
                        </td>
                        <td class="fw-bold"
                            th:text="${line.subtotal != null ? #numbers.formatInteger(line.subtotal, 0, 'POINT') + ' VNĐ' : '0 VNĐ'}"></td>
                        <td class="text-center">
                            <form th:action="@{/cart/remove}" method="post" class="d-inline">
                                <input type="hidden" name="productId" th:value="${line.productId}">
                                <button type="submit" class="btn btn-outline-danger btn-sm" title="Xóa">
                                    <i class="fas fa-trash-alt"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                    <tfoot class="table-light">
                    <tr>
                        <td colspan="3" class="text-end fw-bold pe-4">Tổng cộng</td>
                        <td class="fw-bold text-success fs-5"
                            th:text="${grandTotal != null ? #numbers.formatInteger(grandTotal, 0, 'POINT') + ' VNĐ' : '0 VNĐ'}"></td>
                        <td></td>
                    </tr>
                    </tfoot>
                </table>
            </div>
            <div class="p-3 border-top bg-white d-flex flex-wrap gap-2 justify-content-end">
                <a th:href="@{/checkout}" class="btn btn-success">
                    <i class="fas fa-truck me-1"></i>Tiến hành đặt hàng
                </a>
            </div>
        </div>
        <div class="card-body py-5 text-center text-muted" th:if="${emptyCart}">
            <i class="fas fa-shopping-cart fa-3x mb-3 d-block opacity-50"></i>
            <p class="mb-0">Giỏ hàng đang trống.</p>
            <a th:href="@{/products}" class="btn btn-primary mt-3">Xem sản phẩm</a>
        </div>
    </div>
</div>

<footer class="text-center mt-5 py-4 text-muted small">
    <p>&copy; 2025 - Hệ thống Quản lý Sản phẩm</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
